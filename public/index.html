<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Log</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; }
    .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #475569; }
    input, textarea { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 14px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: #fff; }
    .primary { background: #2563eb; }
    .gray { background: #64748b; }
    .red { background: #dc2626; }
    .stats { text-align: center; color: #64748b; margin-bottom: 10px; }
    .workout { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .workout .title { font-weight: bold; font-size: 16px; }
    .workout .meta { color: #475569; font-size: 14px; margin-top: 4px; }
    .workout small { color: #64748b; display: block; margin-top: 4px; }
    .actions { display: flex; gap: 6px; }
    .empty { text-align: center; color: #64748b; }
    .error { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Workout Log</h1>

  <div class="card">
    <h3 id="formTitle">Add Workout</h3>
    <div class="error" id="error"></div>
    <label for="exercise">Exercise</label>
    <input id="exercise" placeholder="e.g. Squat">
    <div class="row">
      <div><label for="sets">Sets</label><input id="sets" type="number" min="1" placeholder="3"></div>
      <div><label for="reps">Reps</label><input id="reps" type="number" min="1" placeholder="10"></div>
      <div><label for="weight">Weight (kg)</label><input id="weight" type="number" min="0" step="0.5" placeholder="0"></div>
    </div>
    <label for="date">Date</label>
    <input id="date" type="date">
    <label for="notes">Notes</label>
    <textarea id="notes" rows="2" placeholder="Optional"></textarea>
    <button class="primary" id="saveBtn">Save</button>
    <button class="gray" id="cancelBtn" style="display:none">Cancel edit</button>
  </div>

  <div class="card">
    <input id="search" placeholder="Search by exercise name" style="margin-bottom:0">
  </div>

  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<script>
  let editingId = null;
  const $ = id => document.getElementById(id);

  function todayLocal() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function showError(msg) {
    const box = $('error');
    box.textContent = msg;
    box.style.display = msg ? 'block' : 'none';
  }

  async function load() {
    const q = $('search').value.trim();
    const res = await fetch('/api/workouts?exercise=' + encodeURIComponent(q));
    const items = await res.json();
    const list = $('list');
    list.innerHTML = '';
    $('stats').textContent = items.length ? 'Total workouts: ' + items.length : '';

    if (items.length === 0) {
      list.innerHTML = '<div class="card empty">No workouts logged yet</div>';
      return;
    }

    items.forEach(w => {
      const card = document.createElement('div');
      card.className = 'card workout';

      const info = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = w.exercise;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = w.sets + ' x ' + w.reps + (w.weight ? ' | ' + w.weight + ' kg' : '') + ' | ' + w.date;
      info.appendChild(title);
      info.appendChild(meta);
      if (w.notes) {
        const small = document.createElement('small');
        small.textContent = w.notes;
        info.appendChild(small);
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.appendChild(makeBtn('Edit', 'gray', () => startEdit(w)));
      actions.appendChild(makeBtn('Delete', 'red', () => remove(w.id)));

      card.appendChild(info);
      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  function makeBtn(text, cls, handler) {
    const b = document.createElement('button');
    b.textContent = text;
    b.className = cls;
    b.addEventListener('click', handler);
    return b;
  }

  async function save() {
    showError('');
    const body = {
      exercise: $('exercise').value.trim(),
      sets: $('sets').value,
      reps: $('reps').value,
      weight: $('weight').value,
      date: $('date').value,
      notes: $('notes').value.trim()
    };
    const url = editingId ? '/api/workouts/' + editingId : '/api/workouts';
    const method = editingId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) {
      const data = await res.json();
      showError(data.error || 'Something went wrong');
      return;
    }
    resetForm();
    load();
  }

  function startEdit(w) {
    editingId = w.id;
    $('exercise').value = w.exercise;
    $('sets').value = w.sets;
    $('reps').value = w.reps;
    $('weight').value = w.weight;
    $('date').value = w.date;
    $('notes').value = w.notes;
    $('formTitle').textContent = 'Edit Workout';
    $('cancelBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    ['exercise', 'sets', 'reps', 'weight', 'notes'].forEach(id => $(id).value = '');
    $('date').value = todayLocal();
    $('formTitle').textContent = 'Add Workout';
    $('cancelBtn').style.display = 'none';
    showError('');
  }

  async function remove(id) {
    if (!confirm('Delete this workout?')) return;
    await fetch('/api/workouts/' + id, { method: 'DELETE' });
    load();
  }

  $('saveBtn').addEventListener('click', save);
  $('cancelBtn').addEventListener('click', resetForm);
  $('search').addEventListener('input', load);
  $('date').value = todayLocal();
  load();
</script>
</body>
</html>
